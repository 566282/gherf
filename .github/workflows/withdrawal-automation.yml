name: Withdrawal automation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of withdrawals to process in the run'
        required: false
        default: '120'
        type: string
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-withdrawal-automation:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WITHDRAWAL_AUTOMATION_LIMIT: ${{ inputs.limit || '120' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: ./platform
        run: npm ci

      - name: Run withdrawal automation
        working-directory: ./platform
        run: npm run automation:withdrawal
